
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-intelligence"
version = "0.1.0"
description = "A lightweight, local-first intelligent assistant with modular tools and local LLM support."
requires-python = ">=3.10"
dependencies = [
    "cactus-needle",
    "llama-cpp-python",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
